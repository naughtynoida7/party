<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Party🎉</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
</head>
<body>
  <!-- three.js plane (rides on the flight path) -->
  <canvas id="scene"></canvas>

  <!-- the dotted flight path + the colourful trail that draws in behind -->
  <svg id="flightpath" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="trail-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#ff3ea5" />
        <stop offset="50%" stop-color="#ffd23f" />
        <stop offset="100%" stop-color="#21d4c4" />
      </linearGradient>
    </defs>
    <!-- faint dotted route (the planned flight) — x is monotonic so the plane
         always flies forward, with gentle vertical S-waves like the original -->
    <path id="route"
      d="M -80 560 C 130 690 250 320 440 400 C 620 470 690 720 880 560 C 1000 470 1050 420 1130 470"
      fill="none" stroke="#7a4a86" stroke-opacity="0.28"
      stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16" />
    <!-- colourful trail, revealed on scroll (identical path) -->
    <path id="trail"
      d="M -80 560 C 130 690 250 320 440 400 C 620 470 690 720 880 560 C 1000 470 1050 420 1130 470"
      fill="none" stroke="url(#trail-grad)" stroke-width="7"
      stroke-linecap="round" />
  </svg>

  <!-- counter-scrolling copy (fixed overlay, driven by JS) -->
  <div id="copy" aria-hidden="false">
    <h2 class="line" data-at="0.06">You are invited!</h2>
    <h2 class="line" data-at="0.30">Venue - Beloved Navihouse #1803</h2>
    <h2 class="line" data-at="0.52">When? - Friday, 26th June</h2>
    <h2 class="line" data-at="0.74">Peanuts, Booze & Bakchodi</h2>
    <h2 class="line line--finale" data-at="0.95">Farewell 🎉</h2>
  </div>

  <!-- frosted backdrop behind the intro title; clears as the title fades -->
  <div id="introblur" aria-hidden="true"></div>

  <!-- intro title (fades out as you start scrolling) -->
  <header id="intro">
    <p class="kicker">now boarding</p>
    <h1>HOUSE PARTY</h1>
    <p class="sub">Scroll to take off&nbsp;🎉</p>
  </header>

  <!-- scroll spine: gives ScrollTrigger room to scrub -->
  <div id="spacer"></div>

  <div id="loader" aria-live="polite">warming up the engines&hellip;</div>

  <script type="module" src="src/scroll.js"></script>
</body>
</html>
